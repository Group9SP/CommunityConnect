type Business @model @auth(rules: [{allow: public, provider: iam, operations: [read]},
  {allow: owner, ownerField: "owner"},
  {allow: groups, groups: ["Admin"]}])
{
  id: ID! @primaryKey
  name: String!
  description: String
  category: String! @index(queryField: "businessesByCategory")
  location: String! @index(queryField: "businessesByLocation")
  image: String
  rating: Float
  reviewCount: Int
  priceLevel: Int
  languages: [String]
  isVerified: Boolean
  isHowardAffiliated: Boolean
  isMinorityOwned: Boolean
  owner_id: String
}